name: Release

# Pushing a v* tag builds the plugin and publishes it as a release asset, so the zip the README
# points at is never missing from the Releases page.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Belt and braces: the executable bit is set in the index, but a Windows-side checkout can
      # still lose it, and losing it fails the build with a cryptic exit code 126.
      - name: Make wrapper executable
        run: chmod +x gradlew

      # The first build downloads the WebStorm SDK (~1 GB), so allow time on a cold cache.
      - name: Build plugin
        run: ./gradlew buildPlugin --no-daemon

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: build/distributions/*.zip
          generate_release_notes: true
          body: |
            Install: download the zip below, then in your IDE
            **Settings > Plugins > gear icon > Install Plugin from Disk...**
            Do not unzip it first. Restart the IDE afterwards.

            See the [README](https://github.com/ebataille/PSI-Bridge-for-AI-Agents#readme)
            for configuring your MCP client and the hooks.
