org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
org.gradle.caching=true
org.gradle.configuration-cache=false
kotlin.stdlib.default.dependency=false

# No org.gradle.java.home here on purpose: it would hardcode one machine's layout and break the
# build for everyone else. Use JAVA_HOME instead - build.sh sets it for you, falling back to the
# JBR shipped with a local JetBrains IDE when no system JDK is installed.
